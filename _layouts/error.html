<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>

  <div class="row">
    <div class="large-12 large-centered columns">
      <header class="masthead2">
        <a href="{{ site.baseurl }}/"><img src="{{ site.baseurl }}/public/profile.png" alt="Nandu Rajagopala"></a>
      </header>
    </div>
  </div>

  <div class="row">

    <div class="large-6 large-offset-3 columns main-container">

      <main>
        {{ content }}
      </main>

      <footer class="footer-position">
        <p class="copyright">
          © Nandu Rajagopala {{ site.time | date: "%Y" }}
        </p>
      </footer>

    </div>

    <div class="large-2 large-offset-1 columns social">
      <ul>
        <li>
          <a href="https://github.com/{{ site.github }}" target="_blank">
            <i class="fa fa-github"></i>
          </a>
        </li>
        <li>
          <a href="https://medium.com/@{{ site.medium }}" target="_blank">
            <i class="fa fa-medium"></i>
          </a>
        </li>
        <li>
          <a href="https://linkedin.com/in/{{ site.linkedin }}" target="_blank">
           <i class="fa fa-linkedin"></i>
          </a>
        </li>
      </ul>
    </div>

  </div>

</body>

</html>
